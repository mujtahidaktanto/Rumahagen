<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pusat Notifikasi — Mobile</title>
<script src="./support.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:var(--ra-font);}
  .app{width:390px;height:844px;position:relative;overflow:hidden;background:var(--ra-surface);display:flex;flex-direction:column;}
  .topbar{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:#fff;border-bottom:1px solid var(--ra-ink-100);}
  .main{flex:1;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px;}
  .card{background:#fff;border:1px solid var(--ra-ink-100);border-radius:var(--ra-radius-md);}
  .card-pad{padding:16px;}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--ra-ink-100);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-card{background:#fff;border:1px solid var(--ra-ink-100);border-radius:var(--ra-radius-md);padding:16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;}
  .row{display:flex;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--ra-ink-50);}
  a.row:hover{text-decoration:none;}
  .banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--ra-radius-md);padding:12px 14px;}
  .banner-info{background:var(--ra-info-100);border:1px solid var(--ra-blue-200);}
  .banner-warn{background:var(--ra-warning-100);border:1px solid var(--ra-gold-200);}
  .banner-ok{background:var(--ra-success-100);border:1px solid #B7E3CC;}
  .banner-danger{background:var(--ra-danger-100);border:1px solid #F3B9B9;}
  .empty-big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;text-align:center;color:var(--ra-ink-500);}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--ra-ink-100);overflow-x:auto;scrollbar-width:none;flex:none;}
  .tab{padding:12px 4px;margin-right:16px;font-family:var(--ra-font);font-size:14px;font-weight:700;color:var(--ra-ink-300);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;height:44px;white-space:nowrap;}
  .tab.is-active{color:var(--ra-blue-600);border-bottom-color:var(--ra-blue-600);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  textarea.ra-input{height:auto;padding:12px 14px;resize:none;line-height:20px;}
  .req{color:var(--ra-danger-600);}
  .err{color:var(--ra-danger-600);font-size:12px;line-height:16px;}
  .input-err{border-color:var(--ra-danger-600);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;}
  .switch{position:relative;width:44px;height:24px;border-radius:12px;background:var(--ra-ink-200);cursor:pointer;flex:none;border:none;padding:0;}
  .switch.is-on{background:var(--ra-blue-600);}
  .switch-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;}
  .switch.is-on .switch-knob{transform:translateX(20px);}
  .chip-group{display:flex;gap:8px;flex-wrap:wrap;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .thumb{width:52px;height:44px;border-radius:8px;background:var(--ra-ink-100);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ra-ink-300);}
  .scrim{position:absolute;inset:0;background:rgba(11,20,31,.5);z-index:20;display:flex;align-items:flex-end;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 22px;width:100%;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
  .toast{position:absolute;left:16px;right:16px;bottom:20px;background:var(--ra-ink-900);color:#fff;border-radius:var(--ra-radius-md);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:30;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--ra-blue-100);color:var(--ra-blue-600);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
  .drawer-scrim{position:absolute;inset:0;background:rgba(11,20,31,.45);z-index:5;}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:290px;background:var(--ra-blue-900);z-index:6;display:flex;flex-direction:column;box-shadow:var(--ra-shadow-3);}
  .drawer-head{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none;background:#fff;border-bottom:1px solid var(--ra-ink-100);}
  .nav-item{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:var(--ra-radius-sm);color:rgba(255,255,255,.78);text-decoration:none;}
  .nav-item.is-active{background:rgba(255,255,255,.14);color:#fff;}
  .nav-item:hover{text-decoration:none;color:#fff;}
  .nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ra-gold-500);color:var(--ra-ink-900);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;}
  .kv dt{color:var(--ra-ink-500);font-size:13px;line-height:20px;margin:0;}
  .kv dd{margin:0;font-size:14px;line-height:20px;}
  .btn-danger-ghost{color:var(--ra-danger-600);}
  .ra-btn-sm{height:44px;}
  .ra-chip{height:44px;}

  .radio-card{display:flex;flex-direction:column;gap:4px;padding:14px;border:1.5px solid var(--ra-ink-100);border-radius:var(--ra-radius-md);background:#fff;text-align:left;cursor:pointer;font-family:var(--ra-font);width:100%;}
  .radio-card[aria-checked="true"]{border-color:var(--ra-blue-600);background:var(--ra-blue-50);}
  .ra-btn-sm{height:44px;}
  .ra-chip{height:44px;}
</style>
</helmet>
<div class="app">
  <div class="topbar">
    <a class="ra-iconbtn" href="{{backHref}}" aria-label="Kembali" style="margin-left:-8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="ra-title-md ra-truncate-1" style="flex:1;">Notifikasi</span><span class="ra-badge ra-badge-info">{{unreadCount}}</span>
  </div>
  <div class="main ra-scroll">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div class="chip-group" role="group" aria-label="Filter"><sc-for list="{{chips}}" as="c" hint-placeholder-count="2"><button class="ra-chip" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div>
        <div style="flex:1;"></div>
        <button class="ra-btn ra-btn-secondary ra-btn-sm" disabled="{{noUnread}}" onClick="{{markAll}}">Tandai semua dibaca</button>
      </div>
      <div class="switch-row" style="padding:0;"><span class="ra-body-md">Tampilkan yang disembunyikan</span><button class="switch {{dismissedClass}}" role="switch" aria-checked="{{dismissedChecked}}" aria-label="Tampilkan notifikasi yang disembunyikan" onClick="{{toggleDismissed}}"><div class="switch-knob"></div></button></div>
      <div class="card" style="overflow:hidden;">
        <sc-if value="{{showLoading}}" hint-placeholder-val="{{false}}"><div style="padding:16px;display:flex;flex-direction:column;gap:12px;"><div class="ra-skel" style="height:64px;"></div><div class="ra-skel" style="height:64px;"></div><div class="ra-skel" style="height:64px;"></div></div></sc-if>
        <sc-if value="{{showError}}" hint-placeholder-val="{{false}}"><div class="empty-big"><span style="color:var(--ra-danger-600);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="34" height="34"><path d="M12 3l10 18H2L12 3Z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".6" fill="currentColor" stroke="none"/></svg></span><span class="ra-title-md" style="color:var(--ra-ink-900);">Notifikasi gagal dimuat</span><button class="ra-btn ra-btn-primary ra-btn-sm">Coba Lagi</button></div></sc-if>
        <sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}"><div class="empty-big"><span style="color:var(--ra-ink-200);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="44" height="44"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span><span class="ra-title-md" style="color:var(--ra-ink-900);">Belum ada notifikasi</span><p class="ra-body-md" style="max-width:360px;">Pemberitahuan dari tim RumahAgen dan sistem akan muncul di sini.</p></div></sc-if>
        <sc-if value="{{showRows}}" hint-placeholder-val="{{true}}">
          <sc-for list="{{items}}" as="n" hint-placeholder-count="5">
            <div class="row" style="align-items:flex-start;flex-wrap:wrap;">
              <div style="width:10px;padding-top:7px;flex:none;"><sc-if value="{{n.unread}}" hint-placeholder-val="{{true}}"><div style="width:8px;height:8px;border-radius:50%;background:var(--ra-blue-600);" title="Belum dibaca"></div></sc-if></div>
              <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span class="ra-label-lg">{{n.title}}</span><span class="ra-badge {{n.typeBadge}}">{{n.typeLabel}}</span><sc-if value="{{n.failedFlag}}" hint-placeholder-val="{{false}}"><span class="ra-badge ra-badge-danger">Gagal terkirim</span></sc-if><sc-if value="{{n.dismissedFlag}}" hint-placeholder-val="{{false}}"><span class="ra-badge ra-badge-neutral">Disembunyikan</span></sc-if></div>
                <span class="ra-body-md" style="color:var(--ra-ink-700);">{{n.msg}}</span>
                <span class="ra-caption">{{n.when}}</span>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
                  <sc-if value="{{n.hasLink}}" hint-placeholder-val="{{true}}"><a class="ra-btn ra-btn-secondary ra-btn-sm" href="#">Buka</a></sc-if>
                  <sc-if value="{{n.canRead}}" hint-placeholder-val="{{true}}"><button class="ra-btn ra-btn-ghost ra-btn-sm" onClick="{{n.markRead}}">Tandai dibaca</button></sc-if>
                  <sc-if value="{{n.dismissedFlag}}" hint-placeholder-val="{{false}}"><span></span></sc-if>
                  <button class="ra-btn ra-btn-ghost ra-btn-sm" onClick="{{n.dismiss}}">Sembunyikan</button>
                </div>
              </div>
            </div>
          </sc-for>
          <div style="padding:12px 16px;border-top:1px solid var(--ra-ink-100);display:flex;justify-content:center;"><button class="ra-btn ra-btn-secondary ra-btn-sm" disabled="{{moreDone}}" onClick="{{more}}">Muat Lebih Banyak</button></div>
        </sc-if>
      </div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"persona":{"editor":"enum","default":"agent","options":["agent","instruktur","developer","admin"],"section":"Persona pemanggil"},"state":{"editor":"enum","default":"normal","options":["normal","memuat","kosong","gagal_muat"],"section":"Skenario daftar"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = Object.assign({ navCollapsed: false, drawerOpen: false }, { filter: 'all', showDismissed: false, read: {}, dismissed: {}, allRead: false, more: false });
    var self = this;
    ['toggleNav', 'openDrawer', 'closeDrawer', 'stopClick', 'markAll', 'toggleDismissed', 'more'].forEach(function(m){ self[m] = self[m].bind(self); });
  }
  toggleNav(){ this.setState({ navCollapsed: !this.state.navCollapsed }); }
  openDrawer(){ this.setState({ drawerOpen: true }); }
  closeDrawer(){ this.setState({ drawerOpen: false }); }
  stopClick(e){ if (e && e.stopPropagation) e.stopPropagation(); }

  markAll(){ this.setState({ allRead: true }); }
  toggleDismissed(){ this.setState({ showDismissed: !this.state.showDismissed }); }
  more(){ this.setState({ more: true }); }
  renderVals() {
    var st = this.state, pr = this.props;
    var linked = (pr.akun || 'terhubung') === 'terhubung';
    var collapsed = st.navCollapsed === true;
    var shell = {
      navCollapsed: collapsed, navExpanded: !collapsed, navWidth: collapsed ? 76 : 240, labelOp: collapsed ? 0 : 1,
      toggleNav: this.toggleNav, openDrawer: this.openDrawer, closeDrawer: this.closeDrawer, stopClick: this.stopClick,
      drawerOpen: st.drawerOpen === true,
      isLinked: linked, isUnlinked: !linked,
      companyLabel: linked ? 'PT Kanaya Group Developer' : 'Belum terhubung', companyMark: linked ? 'K' : '?'
    };
    
    // notifications (0036): type approval_status|event_reminder|listing_expiring|certificate_issued|lead_new|lainnya; is_read; dismissed_at; delivery_status.
    // Pengguna tidak bisa membuat notifikasi. CATATAN: saat ini hanya push manual Admin yang membuat notifikasi (belum ada pemicu bisnis; SOURCE-Instructor.md §6).
    // related_entity_type/id opak: tautan tujuan dipetakan klien; tipe tak dikenal tanpa tautan.
    var self = this, mode = pr.state || 'normal';
    var persona = pr.persona || 'agent';
    var back = { agent: '../01-Agent/M08-Dashboard.dc.html', instruktur: '../04-Instructor/M08-Dashboard-Instruktur.dc.html', developer: '../03-Developer-Partner/M08-Dashboard-Developer.dc.html', admin: '../02-Admin/M09-Dashboard-Analytics.dc.html' }[persona];
    var TYPE = { approval_status: ['Persetujuan','ra-badge-info'], event_reminder: ['Pengingat event','ra-badge-warning'], listing_expiring: ['Listing segera berakhir','ra-badge-warning'], certificate_issued: ['Sertifikat','ra-badge-success'], lead_new: ['Lead baru','ra-badge-info'], lainnya: ['Info','ra-badge-neutral'] };
    var raw = [
      { id: 'n1', type: 'approval_status', title: 'Pengajuan Anda disetujui', msg: 'Tim RumahAgen menyetujui pengajuan Anda.', when: '12 menit lalu', read: false, dis: false, del: 'delivered', link: true },
      { id: 'n2', type: 'event_reminder', title: 'Event dimulai besok', msg: 'Workshop KPR untuk Agen dimulai besok pukul 13.00.', when: '2 jam lalu', read: false, dis: false, del: 'delivered', link: true },
      { id: 'n3', type: 'certificate_issued', title: 'Sertifikat diterbitkan', msg: 'Sertifikat kursus Sales Skill sudah tersedia.', when: 'Kemarin', read: true, dis: false, del: 'delivered', link: true },
      { id: 'n4', type: 'lainnya', title: 'Pemeliharaan terjadwal', msg: 'Sistem dijadwalkan pemeliharaan Minggu 02.00–03.00 WIB.', when: '3 hari lalu', read: true, dis: false, del: 'delivered', link: false },
      { id: 'n5', type: 'lead_new', title: 'Lead baru pada listing Anda', msg: 'Ada satu lead baru.', when: '4 hari lalu', read: true, dis: true, del: 'failed', link: true }
    ];
    if (st.more) raw = raw.concat([{ id: 'n6', type: 'lainnya', title: 'Pengumuman fitur baru', msg: 'Cek Statistik Saya di dashboard.', when: '1 minggu lalu', read: true, dis: false, del: 'delivered', link: false }]);
    var items = raw.filter(function(n){ var dis = n.dis || !!st.dismissed[n.id]; return st.showDismissed || !dis; }).filter(function(n){ var rd = n.read || st.allRead || !!st.read[n.id]; return st.filter === 'all' || !rd; }).map(function(n){
      var rd = n.read || st.allRead || !!st.read[n.id]; var t = TYPE[n.type]; var dis = n.dis || !!st.dismissed[n.id];
      return { title: n.title, msg: n.msg, when: n.when, typeLabel: t[0], typeBadge: t[1], unread: !rd, canRead: !rd, dismissedFlag: dis, failedFlag: n.del === 'failed', hasLink: n.link,
        markRead: function(){ var r = Object.assign({}, self.state.read); r[n.id] = true; self.setState({ read: r }); },
        dismiss: function(){ var d = Object.assign({}, self.state.dismissed); d[n.id] = true; self.setState({ dismissed: d }); } };
    });
    var unreadCount = raw.filter(function(n){ return !(n.read || st.allRead || st.read[n.id]) && !(n.dis || st.dismissed[n.id]); }).length;
    var chips = [['all','Semua'],['unread','Belum dibaca']].map(function(c){ return { l: c[1], pressed: st.filter === c[0] ? 'true' : 'false', pick: function(){ self.setState({ filter: c[0] }); } }; });
    var out = { backHref: back, items: items, chips: chips, unreadCount: unreadCount, noUnread: unreadCount === 0, dismissedClass: st.showDismissed ? 'is-on' : '', markAll: this.markAll, toggleDismissed: this.toggleDismissed, dismissedChecked: st.showDismissed ? 'true' : 'false',
      showLoading: mode === 'memuat', showError: mode === 'gagal_muat', showEmpty: mode === 'kosong' || (mode === 'normal' && items.length === 0), showRows: mode === 'normal' && items.length > 0, more: this.more, moreDone: st.more === true };
    return Object.assign(shell, out);
  }
}
</script>
</body>
</html>
