<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Detail Promo — Mobile</title>
<script src="./support.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:var(--ra-font);}
  .page{width:390px;box-sizing:border-box;background:#fff;position:relative;}
  .banner{height:220px;background:linear-gradient(135deg,var(--ra-gold-500),var(--ra-gold-700));position:relative;}
  .gtb-btn{position:absolute;top:12px;left:14px;width:38px;height:38px;border-radius:50%;background:rgba(20,24,31,.5);color:#fff;display:flex;align-items:center;justify-content:center;border:none;}
  .unavailable-banner{position:absolute;inset:0;background:rgba(20,24,31,.55);display:flex;align-items:center;justify-content:center;}
  .sec{padding:18px 16px;}
  .prose p{font-size:14.5px;line-height:24px;color:var(--ra-ink-700);margin:0 0 16px;}
  .related-card{border:1px solid var(--ra-ink-100);border-radius:var(--ra-radius-md);padding:12px;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .bottom-cta{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--ra-ink-100);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
</style>
</helmet>
<div class="page">

  <div class="banner">
    <button class="gtb-btn" aria-label="Kembali" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M15 5l-7 7 7 7"/></svg></button>
    <sc-if value="{{isUnavailable}}" hint-placeholder-val="{{false}}">
      <div class="unavailable-banner"><span class="ra-badge {{unavailableBadge}}" style="font-size:13px;"><span class="ra-dot"></span>{{unavailableLabel}}</span></div>
    </sc-if>
  </div>

  <div class="ra-scroll" style="max-height:calc(844px - 220px - 74px);overflow-y:auto;">

    <div class="sec" style="display:flex;flex-direction:column;gap:6px;padding-bottom:0;">
      <span class="ra-badge ra-badge-warning" style="align-self:flex-start;">{{campaign}}</span>
      <h1 class="ra-title-lg">{{title}}</h1>
      <div style="display:flex;align-items:center;gap:6px;color:var(--ra-ink-500);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        <span class="ra-body-md">Berlaku {{scheduleText}}</span>
      </div>
    </div>

    <div class="sec prose">
      <p>{{bodyParagraph1}}</p>
      <p>{{bodyParagraph2}}</p>
    </div>

    <sc-if value="{{hasRelated}}" hint-placeholder-val="{{true}}">
      <div class="sec" style="padding-top:0;">
        <a class="related-card" href="M11-Detail-Developer-Project-Mobile.dc.html">
          <div style="width:36px;height:36px;border-radius:var(--ra-radius-sm);background:var(--ra-blue-100);color:var(--ra-blue-600);display:flex;align-items:center;justify-content:center;flex:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M3 21V9l9-6 9 6v12"/></svg></div>
          <div style="min-width:0;"><div class="ra-label-lg ra-truncate-1" style="font-size:13px;">{{relatedTitle}}</div><span class="ra-caption">Proyek terkait promo ini</span></div>
        </a>
      </div>
    </sc-if>

  </div>

  <div class="bottom-cta">
    <a class="ra-btn ra-btn-primary" style="width:100%;" href="{{ctaHref}}">{{ctaLabel}}</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"promoStatus":{"editor":"enum","default":"active","options":["active","scheduled","expired","archived"],"section":"Skenario status"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const status = this.props.promoStatus ?? 'active';

    const statusCopy = {
      scheduled: { label: 'Segera Dimulai', badge: 'ra-badge-info' },
      expired: { label: 'Promo Telah Berakhir', badge: 'ra-badge-neutral' },
      archived: { label: 'Promo Sudah Diarsipkan', badge: 'ra-badge-neutral' }
    };
    const isUnavailable = status !== 'active';
    const c = statusCopy[status] ?? { label: '', badge: '' };

    return {
      title: 'Cashback Rp 2 Juta — Klaim Proyek Kanaya Residence',
      campaign: 'Developer Partner',
      scheduleText: '1 – 30 Sep 2026',
      isUnavailable,
      unavailableLabel: c.label,
      unavailableBadge: c.badge,
      bodyParagraph1: 'RumahAgen bekerja sama dengan PT Kanaya Group Developer menghadirkan program cashback khusus bagi agen yang berhasil klaim dan closing unit pertama di proyek Cluster Kanaya Residence.',
      bodyParagraph2: 'Cashback sebesar Rp 2.000.000 akan dicairkan maksimal 14 hari kerja setelah akad kredit disetujui bank, syarat dan ketentuan berlaku.',
      hasRelated: true,
      relatedTitle: 'Cluster Kanaya Residence',
      ctaHref: 'M11-Detail-Developer-Project-Mobile.dc.html',
      ctaLabel: 'Lihat Proyek & Klaim Sekarang'
    };
  }
}
</script>
</body>
</html>
