<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Akun Dibatasi — Desktop</title>
<script src="./support.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;}
  .stage{width:1440px;height:900px;background:linear-gradient(160deg,var(--ra-blue-900) 0%,var(--ra-blue-600) 55%,var(--ra-gold-600) 130%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-family:var(--ra-font);}
  .card{width:480px;background:#fff;border-radius:var(--ra-radius-lg);box-shadow:var(--ra-shadow-3);padding:40px 40px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;}
  .icon-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</helmet>
<div class="stage">

  <!-- checking / loading state -->
  <sc-if value="{{isChecking}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;color:#fff;">
      <div style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 0.8s linear infinite;"></div>
      <span class="ra-body-md" style="color:#fff;">Memeriksa status sesi Anda…</span>
    </div>
  </sc-if>

  <!-- blocked gate -->
  <sc-if value="{{isBlocked}}" hint-placeholder-val="{{true}}">
    <div class="card">
      <img src="/_blob/52b17458b047cd48bbb134bb60ce32fa" alt="RumahAgen" style="height:40px;width:auto;object-fit:contain;">

      <div class="icon-ring" style="background:{{reasonBg}};color:{{reasonColor}};">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <h1 class="ra-headline">{{title}}</h1>
        <p class="ra-body-md" style="color:var(--ra-ink-500);">{{body}}</p>
      </div>

      <div class="ra-badge {{badgeClass}}" style="align-self:center;"><span class="ra-dot"></span>{{statusLabel}}</div>

      <p class="ra-caption">Alasan lebih rinci telah dikirim ke email terdaftar Anda. Status ini berlaku untuk seluruh akun — tidak ada bagian aplikasi yang bisa diakses selama status ini aktif.</p>

      <div style="display:flex;gap:12px;width:100%;margin-top:8px;">
        <button class="ra-btn ra-btn-secondary" style="flex:1;">Keluar dari Akun</button>
        <button class="ra-btn ra-btn-primary" style="flex:1;">Hubungi Dukungan</button>
      </div>

      <a href="#" class="ra-caption" style="margin-top:4px;">Pelajari kebijakan platform RumahAgen</a>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reason":{"editor":"enum","default":"suspended","options":["suspended","rejected","pending_review"],"section":"Skenario"},"isChecking":{"editor":"boolean","default":false,"section":"Skenario"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const reason = this.props.reason ?? 'suspended';
    const isChecking = this.props.isChecking ?? false;
    const copy = {
      suspended: {
        title: 'Akun Anda Ditangguhkan Sementara',
        body: 'Tim kami menangguhkan akses akun ini karena terindikasi melanggar kebijakan platform. Anda tidak dapat membuat listing, mengelola organisasi, atau mengakses fitur lain selama status ini berlaku.',
        statusLabel: 'suspended',
        badgeClass: 'ra-badge-danger',
        reasonBg: '#FCE7E7',
        reasonColor: '#D23B3B'
      },
      pending_review: {
        title: 'Akun Anda Sedang Ditinjau',
        body: 'Pendaftaran Anda sedang ditinjau tim RumahAgen. Anda akan dapat masuk setelah peninjauan selesai.',
        statusLabel: 'pending_review',
        badgeClass: 'ra-badge-warning',
        reasonBg: 'var(--ra-warning-100)',
        reasonColor: 'var(--ra-warning-600)'
      },
      rejected: {
        title: 'Pendaftaran Akun Ditolak',
        body: 'Verifikasi dokumen pendaftaran Anda tidak memenuhi syarat platform. Anda dapat mengajukan pendaftaran ulang setelah melengkapi dokumen yang diminta.',
        statusLabel: 'rejected',
        badgeClass: 'ra-badge-danger',
        reasonBg: '#FCE7E7',
        reasonColor: '#D23B3B'
      }
    };
    const c = copy[reason] ?? copy.suspended;
    return { isChecking, isBlocked: !isChecking, ...c };
  }
}
</script>
</body>
</html>
